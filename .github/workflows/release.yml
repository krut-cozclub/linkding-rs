name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,  os: ubuntu-latest,    target: x86_64-unknown-linux-musl,  musl: true }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, musl: true }
          - { name: macos-aarch64, os: macos-latest,     target: aarch64-apple-darwin }
          - { name: windows-x86_64, os: windows-latest,  target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          V=${GITHUB_REF_NAME}
          if [ "${{ matrix.name }}" = "windows-x86_64" ]; then
            7z a dist/linkding-rs-$V-${{ matrix.name }}.zip ./target/${{ matrix.target }}/release/linkding-rs.exe README.md
          else
            tar -C target/${{ matrix.target }}/release -czf dist/linkding-rs-$V-${{ matrix.name }}.tar.gz linkding-rs
          fi
          cp target/${{ matrix.target }}/release/linkding-rs* /tmp/ 2>/dev/null || true
          mkdir -p raw && cp target/${{ matrix.target }}/release/linkding-rs raw/linkding-rs 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with: { name: "dist-${{ matrix.name }}", path: dist/* }
      - if: matrix.musl
        uses: actions/upload-artifact@v4
        with: { name: "raw-${{ matrix.name }}", path: raw/linkding-rs }

  docker:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: raw-linux-x86_64, path: bin/amd64 }
      - uses: actions/download-artifact@v4
        with: { name: raw-linux-aarch64, path: bin/arm64 }
      - run: chmod +x bin/*/linkding-rs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: [binaries, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "dist-*", path: dist, merge-multiple: true }
      - run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          body: |
            ## Docker
            ```
            docker run -p 9090:9090 -v ld-data:/data -e LD_SUPERUSER_NAME=admin -e LD_SUPERUSER_PASSWORD=change-me ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```
            Multi-arch (amd64 + arm64). Static binaries for Linux, macOS (Apple silicon) and Windows are attached below.
