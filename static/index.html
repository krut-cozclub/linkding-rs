<!DOCTYPE html>
<html lang="en" data-v="{{v}}">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/static/favicon.ico?v={{v}}" sizes="48x48">
  <link rel="icon" href="/static/favicon.svg?v={{v}}" sizes="any" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v={{v}}">
  <link rel="mask-icon" href="/static/safari-pinned-tab.svg?v={{v}}" color="#5856e0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimal-ui">
  <meta name="description" content="Self-hosted bookmark service">
  <meta name="robots" content="noindex">
  <title>Linkding</title>
  <script>
    // Apply the saved theme before first paint to avoid a flash
    (function () {
      var t = ''; try { t = localStorage.getItem('ld.theme') || ''; } catch (e) {}
      window.__theme = t;
    })();
  </script>
  <link id="css-dark" href="/static/theme-dark.css?v={{v}}" rel="stylesheet" media="(prefers-color-scheme: dark)">
  <link id="css-light" href="/static/theme-light.css?v={{v}}" rel="stylesheet" media="(prefers-color-scheme: light)">
  <script>
    (function () {
      var t = window.__theme, d = document.getElementById('css-dark'), l = document.getElementById('css-light');
      if (t === 'light') { d.media = 'not all'; l.media = 'all'; }
      else if (t === 'dark') { l.media = 'not all'; d.media = 'all'; }
    })();
  </script>
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161822">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#5856e0">
</head>
<body>
  <header class="container">
    <div class="message-list" id="messages"></div>
    <div class="d-flex justify-between">
      <a href="/bookmarks" data-nav class="app-link d-flex align-center">
        <img class="app-logo" src="/static/logo.png?v={{v}}" alt="Application logo">
        <span class="app-name">LINKDING</span>
      </a>
      <nav id="nav"></nav>
    </div>
  </header>
  <div class="content container" id="content"></div>
  <div class="modals"></div>
  <script src="/static/app.js?v={{v}}"></script>
</body>
</html>
