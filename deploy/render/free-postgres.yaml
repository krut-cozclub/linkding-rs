# Render FREE tier: free web service + free Postgres (no disk needed).
# Caveats of Render's free plans: the web service sleeps after ~15 min idle (first request is slow),
# and the free Postgres database expires after 30 days - upgrade it or export your bookmarks first.
# Use in the dashboard: New -> Blueprint -> "Blueprint file path": deploy/render/free-postgres.yaml
services:
  - type: web
    name: linkding-rs
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LD_SUPERUSER_NAME
        value: admin
      - key: LD_SUPERUSER_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: linkding-db
          property: connectionString

databases:
  - name: linkding-db
    plan: free
